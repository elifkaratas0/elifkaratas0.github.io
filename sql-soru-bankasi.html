<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SQL Soru Bankası</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [data-theme="dark"] {
      --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3250;
      --ink:#f0f1f8; --mid:#9ca3c8; --light:#5c6490;
      --accent:#7c6fef; --accent2:#56cfb2;
      --green:#4ade80; --green-bg:rgba(74,222,128,0.12);
      --red:#f87171; --red-bg:rgba(248,113,113,0.12);
      --yellow:#fbbf24; --yellow-bg:rgba(251,191,36,0.12);
      --code-bg:#0d1117; --shadow:rgba(0,0,0,0.5);
    }
    [data-theme="light"] {
      --bg:#f4f5f7; --surface:#ffffff; --surface2:#f0f1f6; --border:#e2e3ea;
      --ink:#1a1a2e; --mid:#555570; --light:#9999aa;
      --accent:#6c63ff; --accent2:#38bfa1;
      --green:#16a34a; --green-bg:rgba(22,163,74,0.1);
      --red:#dc2626; --red-bg:rgba(220,38,38,0.1);
      --yellow:#d97706; --yellow-bg:rgba(217,119,6,0.1);
      --code-bg:#f1f3f5; --shadow:rgba(0,0,0,0.1);
    }

    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; transition:background .3s,color .3s; }

    /* HEADER */
    header { background:var(--surface); border-bottom:1px solid var(--border); padding:1rem 2rem; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
    .header-logo { display:flex; align-items:center; gap:.75rem; }
    .logo-badge { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-weight:700; font-size:.8rem; padding:.4rem .8rem; border-radius:8px; font-family:'Fira Code',monospace; }
    .header-title { font-size:1rem; font-weight:600; color:var(--ink); }
    .header-sub { font-size:.75rem; color:var(--light); }
    .header-right { display:flex; align-items:center; gap:.75rem; }
    .score-pill { background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:.35rem 1rem; font-size:.8rem; font-weight:600; color:var(--mid); }
    .score-pill span { color:var(--green); }
    .btn { display:inline-flex; align-items:center; gap:.4rem; border-radius:8px; padding:.4rem .9rem; cursor:pointer; font-size:.78rem; font-weight:600; border:none; transition:all .2s; font-family:inherit; }
    .btn-ghost { background:var(--surface2); border:1px solid var(--border); color:var(--mid); }
    .btn-ghost:hover { color:var(--ink); border-color:var(--accent); }
    .btn-accent { background:var(--accent); color:#fff; }
    .btn-accent:hover { opacity:.88; }
    .btn-danger { background:var(--red-bg); border:1px solid var(--red); color:var(--red); }
    .btn-danger:hover { background:var(--red); color:#fff; }

    /* MAIN */
    main { max-width:900px; margin:0 auto; padding:2rem; }

    /* TAB BAR */
    .tabs { display:flex; gap:.5rem; margin-bottom:2rem; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.4rem; }
    .tab { flex:1; text-align:center; padding:.6rem; border-radius:7px; font-size:.82rem; font-weight:600; cursor:pointer; transition:all .2s; color:var(--mid); border:none; background:none; font-family:inherit; }
    .tab.active { background:var(--accent); color:#fff; }
    .tab:hover:not(.active) { background:var(--surface2); color:var(--ink); }

    /* STATS BAR */
    .stats-bar { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:2rem; }
    .stat-mini { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:1rem; text-align:center; }
    .stat-mini-val { font-size:1.6rem; font-weight:700; color:var(--ink); }
    .stat-mini-val.green { color:var(--green); }
    .stat-mini-val.red { color:var(--red); }
    .stat-mini-val.yellow { color:var(--yellow); }
    .stat-mini-label { font-size:.72rem; color:var(--light); margin-top:.25rem; }

    /* SORU KARTI */
    .soru-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:2rem; margin-bottom:1.5rem; }
    .soru-meta { display:flex; align-items:center; gap:.75rem; margin-bottom:1.25rem; flex-wrap:wrap; }
    .soru-num { font-size:.75rem; font-weight:600; color:var(--light); font-family:'Fira Code',monospace; }
    .seviye-badge { font-size:.7rem; font-weight:700; padding:.25rem .65rem; border-radius:20px; }
    .seviye-badge.baslangic { background:var(--green-bg); color:var(--green); }
    .seviye-badge.orta { background:var(--yellow-bg); color:var(--yellow); }
    .seviye-badge.ileri { background:var(--red-bg); color:var(--red); }
    .konu-badge { font-size:.7rem; font-weight:600; padding:.25rem .65rem; border-radius:20px; background:rgba(124,111,239,.12); color:var(--accent); }
    .soru-text { font-size:1rem; font-weight:500; color:var(--ink); line-height:1.65; margin-bottom:1.5rem; }

    /* KOD BLOĞU */
    .code-block { background:var(--code-bg); border:1px solid var(--border); border-radius:8px; padding:1rem 1.25rem; margin-bottom:1.5rem; font-family:'Fira Code',monospace; font-size:.85rem; color:#a9b7d6; line-height:1.7; overflow-x:auto; }
    .kw { color:#7c6fef; } /* keyword */
    .fn { color:#56cfb2; } /* function */
    .str { color:#fbbf24; } /* string */
    .num { color:#f87171; } /* number */
    .cm { color:#5c6490; font-style:italic; } /* comment */

    /* SEÇENEKLER */
    .secenekler { display:flex; flex-direction:column; gap:.75rem; margin-bottom:1.5rem; }
    .secenek { display:flex; align-items:flex-start; gap:.75rem; padding:1rem 1.25rem; border:1.5px solid var(--border); border-radius:10px; cursor:pointer; transition:all .2s; background:var(--surface2); }
    .secenek:hover:not(.disabled) { border-color:var(--accent); background:rgba(124,111,239,.06); }
    .secenek.selected { border-color:var(--accent); background:rgba(124,111,239,.1); }
    .secenek.correct { border-color:var(--green); background:var(--green-bg); }
    .secenek.wrong { border-color:var(--red); background:var(--red-bg); }
    .secenek.disabled { cursor:default; }
    .secenek-harf { width:28px; height:28px; border-radius:6px; background:var(--border); display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:700; color:var(--mid); flex-shrink:0; transition:all .2s; font-family:'Fira Code',monospace; }
    .secenek.selected .secenek-harf { background:var(--accent); color:#fff; }
    .secenek.correct .secenek-harf { background:var(--green); color:#fff; }
    .secenek.wrong .secenek-harf { background:var(--red); color:#fff; }
    .secenek-text { font-size:.9rem; color:var(--mid); line-height:1.5; font-family:'Fira Code',monospace; }
    .secenek.correct .secenek-text, .secenek.wrong .secenek-text { color:var(--ink); }

    /* SONUÇ */
    .sonuc { display:none; padding:1rem 1.25rem; border-radius:10px; margin-bottom:1.5rem; }
    .sonuc.show { display:block; }
    .sonuc.dogru { background:var(--green-bg); border:1px solid var(--green); }
    .sonuc.yanlis { background:var(--red-bg); border:1px solid var(--red); }
    .sonuc-baslik { font-size:.9rem; font-weight:700; margin-bottom:.5rem; }
    .sonuc.dogru .sonuc-baslik { color:var(--green); }
    .sonuc.yanlis .sonuc-baslik { color:var(--red); }
    .sonuc-aciklama { font-size:.85rem; color:var(--mid); line-height:1.7; }

    /* AKSIYON */
    .soru-actions { display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; }
    .progress-bar { flex:1; height:6px; background:var(--border); border-radius:3px; overflow:hidden; min-width:100px; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:3px; transition:width .4s; }

    /* SINAV MODU */
    .sinav-header { background:var(--red-bg); border:1px solid var(--red); border-radius:10px; padding:1rem 1.5rem; margin-bottom:1.5rem; display:flex; align-items:center; justify-content:space-between; }
    .sinav-timer { font-family:'Fira Code',monospace; font-size:1.5rem; font-weight:700; color:var(--red); }
    .sinav-info { font-size:.82rem; color:var(--red); }
    .sinav-timer.warning { animation:pulse .5s infinite alternate; }
    @keyframes pulse { from{opacity:1} to{opacity:.5} }

    /* SONUÇ EKRANI */
    .sonuc-ekrani { display:none; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:3rem 2rem; text-align:center; }
    .sonuc-ekrani.show { display:block; }
    .sonuc-emoji { font-size:4rem; margin-bottom:1rem; }
    .sonuc-baslik2 { font-size:1.5rem; font-weight:700; color:var(--ink); margin-bottom:.5rem; }
    .sonuc-puan { font-size:3rem; font-weight:700; color:var(--accent); margin:1rem 0; }
    .sonuc-detay { font-size:.9rem; color:var(--mid); margin-bottom:2rem; }
    .sonuc-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-bottom:2rem; }
    .sonuc-mini { background:var(--surface2); border-radius:10px; padding:1rem; }
    .sonuc-mini-val { font-size:1.5rem; font-weight:700; }
    .sonuc-mini-label { font-size:.72rem; color:var(--light); margin-top:.25rem; }

    /* FİLTRE */
    .filtre-bar { display:flex; gap:.75rem; margin-bottom:1.5rem; flex-wrap:wrap; }
    .filtre-btn { font-size:.78rem; font-weight:600; padding:.4rem .9rem; border-radius:20px; cursor:pointer; border:1.5px solid var(--border); background:var(--surface); color:var(--mid); transition:all .2s; font-family:inherit; }
    .filtre-btn:hover, .filtre-btn.active { border-color:var(--accent); color:var(--accent); background:rgba(124,111,239,.08); }

    @media(max-width:640px) { main{padding:1rem} .stats-bar{grid-template-columns:repeat(2,1fr)} .sonuc-grid{grid-template-columns:repeat(2,1fr)} }
  </style>
</head>
<body>

<header>
  <div class="header-logo">
    <div class="logo-badge">SQL</div>
    <div>
      <div class="header-title">SQL Soru Bankası</div>
      <div class="header-sub">Öğren · Pratik Yap · Test Et</div>
    </div>
  </div>
  <div class="header-right">
    <div class="score-pill">✅ <span id="dogruSay">0</span> · ❌ <span id="yanlisSay">0</span></div>
    <button class="btn btn-ghost" id="themeBtn" onclick="toggleTheme()">🌙 Koyu</button>
  </div>
</header>

<main>

  <div class="tabs">
    <button class="tab active" onclick="setMod('calis')" id="tabCalis">📚 Çalışma Modu</button>
    <button class="tab" onclick="setMod('sinav')" id="tabSinav">⏱️ Sınav Modu</button>
  </div>

  <div class="stats-bar">
    <div class="stat-mini">
      <div class="stat-mini-val" id="toplamSoru">0</div>
      <div class="stat-mini-label">Toplam Soru</div>
    </div>
    <div class="stat-mini">
      <div class="stat-mini-val" id="cozulenSoru">0</div>
      <div class="stat-mini-label">Çözülen</div>
    </div>
    <div class="stat-mini">
      <div class="stat-mini-val green" id="dogruSoru">0</div>
      <div class="stat-mini-label">Doğru</div>
    </div>
    <div class="stat-mini">
      <div class="stat-mini-val red" id="yanlisSoru">0</div>
      <div class="stat-mini-label">Yanlış</div>
    </div>
  </div>

  <!-- SINAV HEADER -->
  <div class="sinav-header" id="sinavHeader" style="display:none">
    <div>
      <div class="sinav-info">⏱️ Sınav Modu — 10 Soruluk Test</div>
      <div class="sinav-info" id="sinavSoru">Soru 1 / 10</div>
    </div>
    <div class="sinav-timer" id="sinavTimer">02:00</div>
  </div>

  <!-- FİLTRE -->
  <div class="filtre-bar" id="filtreBar">
    <button class="filtre-btn active" onclick="filtrele('hepsi',this)">Hepsi</button>
    <button class="filtre-btn" onclick="filtrele('baslangic',this)">🟢 Başlangıç</button>
    <button class="filtre-btn" onclick="filtrele('orta',this)">🟡 Orta</button>
    <button class="filtre-btn" onclick="filtrele('ileri',this)">🔴 İleri</button>
    <button class="filtre-btn" onclick="filtrele('SELECT',this)">SELECT</button>
    <button class="filtre-btn" onclick="filtrele('WHERE',this)">WHERE</button>
    <button class="filtre-btn" onclick="filtrele('JOIN',this)">JOIN</button>
    <button class="filtre-btn" onclick="filtrele('GROUP BY',this)">GROUP BY</button>
  </div>

  <!-- SORU -->
  <div id="soruWrap"></div>

  <!-- SONUÇ EKRANI -->
  <div class="sonuc-ekrani" id="sonucEkrani">
    <div class="sonuc-emoji" id="sonucEmoji">🎉</div>
    <div class="sonuc-baslik2" id="sonucBaslik">Test Tamamlandı!</div>
    <div class="sonuc-puan" id="sonucPuan">0/10</div>
    <div class="sonuc-detay" id="sonucDetay"></div>
    <div class="sonuc-grid">
      <div class="sonuc-mini"><div class="sonuc-mini-val" id="sDogru" style="color:var(--green)">0</div><div class="sonuc-mini-label">Doğru</div></div>
      <div class="sonuc-mini"><div class="sonuc-mini-val" id="sYanlis" style="color:var(--red)">0</div><div class="sonuc-mini-label">Yanlış</div></div>
      <div class="sonuc-mini"><div class="sonuc-mini-val" id="sSure" style="color:var(--accent)">—</div><div class="sonuc-mini-label">Süre</div></div>
    </div>
    <button class="btn btn-accent" onclick="tekrarla()" style="font-size:.9rem;padding:.75rem 2rem">🔄 Tekrar Dene</button>
  </div>

</main>

  {id:62,seviye:'orta',konu:'SUBQUERY',soru:'Correlated subquery nedir?',kod:'',secenekler:['Dış sorguya referans veren alt sorgu','Birden fazla sonuç döndüren alt sorgu','En hızlı alt sorgu türü','Sadece FROM içinde kullanılan alt sorgu'],dogru:0,aciklama:'Correlated subquery dış sorgunun her satırı için yeniden çalışır. Dış sorguya referans verir, bu yüzden yavaş olabilir.'},
  {id:63,seviye:'orta',konu:'GROUP BY',soru:'Aşağıdaki sorgunun çıktısı nedir?',kod:'<span class="kw">SELECT</span> <span class="fn">MAX</span>(skor) - <span class="fn">MIN</span>(skor) <span class="kw">AS</span> aralik

  {id:64,seviye:'orta',konu:'SELECT',soru:'NVL veya ISNULL fonksiyonu ne yapar?',kod:'<span class="kw">SELECT</span> <span class="fn">ISNULL</span>(telefon, \'Bilinmiyor\') <span class="kw">FROM</span> musteriler',secenekler:['NULL değeri başka bir değerle değiştirir','NULL değerleri siler','NULL kontrolü yapar TRUE/FALSE döner','NULL sayısını hesaplar'],dogru:0,aciklama:'ISNULL() veya NVL() NULL değeri belirtilen alternatif değerle değiştirir. COALESCE daha genel bir alternatiftir.'},
  {id:65,seviye:'orta',konu:'SELECT',soru:'Hangi komut tablonun yapısını değiştirir?',kod:'',secenekler:['ALTER TABLE','MODIFY TABLE','CHANGE TABLE','UPDATE TABLE'],dogru:0,aciklama:'ALTER TABLE komutu mevcut tabloya sütun ekler, siler veya değiştirir. ADD COLUMN, DROP COLUMN, MODIFY COLUMN ile kullanılır.'},
  {id:66,seviye:'orta',konu:'SELECT',soru:'PRIMARY KEY hakkında hangisi doğrudur?',kod:'',secenekler:['NULL olamaz ve benzersiz olmalı','Sadece tam sayı olabilir','Bir tabloda birden fazla olabilir','NULL olabilir'],dogru:0,aciklama:'PRIMARY KEY iki özelliği zorunlu kılar: NULL olamaz (NOT NULL) ve benzersiz olmalı (UNIQUE). Her tabloda sadece 1 PRIMARY KEY olabilir.'},

  {id:68,seviye:'ileri',konu:'WINDOW',soru:'RANK() ve DENSE_RANK() arasındaki fark nedir?',kod:'',secenekler:['RANK() eşit değerlerde boşluk bırakır, DENSE_RANK() bırakmaz','DENSE_RANK() daha yavaştır','RANK() sadece sayısal değerler için çalışır','Fark yoktur'],dogru:0,aciklama:'RANK(): 1,2,2,4 (3 atlanır). DENSE_RANK(): 1,2,2,3 (boşluk yok). Sıralama senaryosuna göre ikisi de kullanılır.'},

  {id:71,seviye:'ileri',konu:'CTE',soru:'CTE (Common Table Expression) nedir?',kod:'<span class="kw">WITH</span> yuksek_skor <span class="kw">AS</span> (

  {id:72,seviye:'ileri',konu:'CTE',soru:'Recursive CTE ne işe yarar?',kod:'',secenekler:['Kendine referans vererek hiyerarşik verileri işler','Döngüsel sorgular oluşturur','Performansı artırır','Sadece sayısal verilerle çalışır'],dogru:0,aciklama:'Recursive CTE kendine referans vererek çalışır. Organizasyon şeması, dosya sistemi gibi hiyerarşik veriler için idealdir.'},
  {id:73,seviye:'ileri',konu:'INDEX',soru:'Index (dizin) ne işe yarar?',kod:'',secenekler:['Sorgu hızını artırır ama yazma işlemlerini yavaşlatabilir','Her zaman performansı artırır','Veri bütünlüğünü sağlar','Sütunları şifreler'],dogru:0,aciklama:'Index okuma sorgularını hızlandırır ancak INSERT/UPDATE/DELETE işlemlerini yavaşlatır çünkü index de güncellenmesi gerekir.'},
  {id:74,seviye:'ileri',konu:'INDEX',soru:'Hangi sütuna index koymak en mantıklıdır?',kod:'',secenekler:['Sık WHERE ve JOIN koşulunda kullanılan sütunlar','Tüm sütunlara','Sadece PRIMARY KEY\'e','Nadiren sorgulanan sütunlara'],dogru:0,aciklama:'Index en çok WHERE, JOIN ve ORDER BY\'da kullanılan sütunlarda faydalıdır. Her sütuna index koymak yazma performansını düşürür.'},
  {id:75,seviye:'ileri',konu:'VIEW',soru:'VIEW (Görünüm) nedir?',kod:'<span class="kw">CREATE VIEW</span> aktif_urunler <span class="kw">AS</span>

  {id:76,seviye:'ileri',konu:'VIEW',soru:'Materialized View ile normal View arasındaki fark nedir?',kod:'',secenekler:['Materialized View sonuçları fiziksel olarak saklar','Normal View daha yavaştır','Materialized View güncel verisi her zaman anlıktır','Fark yoktur'],dogru:0,aciklama:'Materialized View sonuçları disk üzerinde saklar, çok hızlı okuma sağlar. Ancak periyodik refresh gerektirir, anlık veri değildir.'},
  {id:77,seviye:'ileri',konu:'TRANSACTION',soru:'ACID ne anlama gelir?',kod:'',secenekler:['Atomicity, Consistency, Isolation, Durability','Auto Commit, Index, Data','Aggregate, Connect, Insert, Delete','Application, Code, Integration, Deploy'],dogru:0,aciklama:'ACID veritabanı transaction özelliklerini tanımlar: Atomicity (ya hep ya hiç), Consistency (tutarlılık), Isolation (yalıtım), Durability (kalıcılık).'},
  {id:78,seviye:'ileri',konu:'TRANSACTION',soru:'ROLLBACK komutu ne yapar?',kod:'',secenekler:['Transaction\'ı geri alır','Transaction\'ı kaydeder','Tabloyu siler','Bağlantıyı keser'],dogru:0,aciklama:'ROLLBACK transaction içindeki tüm değişiklikleri geri alır. COMMIT ise kalıcı hale getirir.'},
  {id:79,seviye:'ileri',konu:'WINDOW',soru:'NTILE(4) fonksiyonu ne yapar?',kod:'<span class="kw">SELECT</span> ad, skor,

  {id:80,seviye:'ileri',konu:'SUBQUERY',soru:'Aşağıdaki sorgu ne yapar?',kod:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> urunler

  {id:81,seviye:'ileri',konu:'WINDOW',soru:'SUM() OVER() ile GROUP BY SUM() arasındaki fark nedir?',kod:'',secenekler:['OVER() satır sayısını korur, GROUP BY satırları gruplar','OVER() daha yavaştır','GROUP BY daha fazla özellik sunar','Fark yoktur'],dogru:0,aciklama:'SUM() OVER() window function her satırı gösterirken toplam hesaplar. GROUP BY SUM() ise satırları gruplar, detay kaybolur.'},

  {id:83,seviye:'ileri',konu:'CTE',soru:'CTE\'nin subquery\'ye göre avantajı nedir?',kod:'',secenekler:['Daha okunabilir ve aynı sonucu birden fazla yerde kullanabilirsin','Her zaman daha hızlıdır','Daha az bellek kullanır','Sadece JOIN ile kullanılabilir'],dogru:0,aciklama:'CTE okunabilirliği artırır ve aynı sorguyu birden fazla yerde referans edebilirsin. Recursive sorgular için zorunludur.'},

  {id:85,seviye:'ileri',konu:'INDEX',soru:'Covering Index nedir?',kod:'',secenekler:['Sorgunun ihtiyaç duyduğu tüm sütunları içeren index','En büyük index türü','Otomatik oluşturulan index','Primary key üzerindeki index'],dogru:0,aciklama:'Covering Index sorgunun ihtiyaç duyduğu tüm sütunları içerir. Tabloya erişmeden index üzerinden yanıt verebilir, çok hızlıdır.'},

  {id:87,seviye:'ileri',konu:'TRANSACTION',soru:'SAVEPOINT ne işe yarar?',kod:'',secenekler:['Transaction içinde geri dönülecek nokta belirler','Veriyi kaydeder','Bağlantıyı güvence altına alır','Index oluşturur'],dogru:0,aciklama:'SAVEPOINT transaction içinde checkpoint oluşturur. ROLLBACK TO savepoint_adi ile o noktaya dönülebilir, tüm transaction geri alınmaz.'},

  {id:90,seviye:'ileri',konu:'CTE',soru:'Aşağıdaki recursive CTE ne yapar?',kod:'<span class="kw">WITH RECURSIVE</span> hiyerarsi <span class="kw">AS</span> (

  {id:91,seviye:'ileri',konu:'INDEX',soru:'Query Optimizer ne yapar?',kod:'',secenekler:['En verimli sorgu planını otomatik seçer','SQL kodunu düzeltir','Index oluşturur','Tabloları optimize eder'],dogru:0,aciklama:'Query Optimizer sorguyu çalıştırmadan önce en verimli yolu (execution plan) belirler. Index kullanımı, join sırası gibi kararları verir.'},

  {id:93,seviye:'ileri',konu:'SUBQUERY',soru:'Lateral Join nedir?',kod:'',secenekler:['Sol tablonun her satırı için sağ tarafı ayrı değerlendirir','Normal JOIN\'in diğer adı','Performansı düşüren JOIN türü','Sadece PostgreSQL\'de çalışır'],dogru:0,aciklama:'LATERAL JOIN sol tarafın her satırını sağ tarafa parametre olarak gönderir. Correlated subquery\'nin JOIN versiyonudur, çok güçlüdür.'},
  {id:94,seviye:'ileri',konu:'INDEX',soru:'Partial Index nedir?',kod:'<span class="kw">CREATE INDEX</span> idx_hatali

  {id:95,seviye:'ileri',konu:'TRANSACTION',soru:'Deadlock nedir?',kod:'',secenekler:['İki transaction birbirini beklediği için hiçbirinin ilerleyememesi','Çok yavaş çalışan sorgu','Bozuk index','Disk dolu hatası'],dogru:0,aciklama:'Deadlock iki transaction\'ın birbirinin tuttuğu kaynakları beklediği çıkmaz durumudur. Veritabanı deadlock\'u tespit edip birini geri alır.'},
  {id:96,seviye:'ileri',konu:'VIEW',soru:'Aşağıdakilerden hangisi VIEW kullanmanın avantajlarından DEĞİLDİR?',kod:'',secenekler:['Her zaman daha hızlı sorgu performansı sağlar','Güvenlik — hassas sütunları gizler','Karmaşık sorguları basitleştirir','Bağımsızlık — tablo yapısı değişse view arayüz sağlar'],dogru:0,aciklama:'VIEW her zaman performansı artırmaz. Materialized VIEW hariç normal VIEW her sorguda yeniden çalışır. Faydaları güvenlik, soyutlama ve basitliktir.'},
  {id:97,seviye:'ileri',konu:'CTE',soru:'Birden fazla CTE nasıl tanımlanır?',kod:'<span class="kw">WITH</span>
  ilk_cte <span class="kw">AS</span> (<span class="kw">SELECT</span> ...),

  {id:99,seviye:'ileri',konu:'INDEX',soru:'Bir sorgunun index kullanıp kullanmadığını nasıl kontrol edersin?',kod:'',secenekler:['EXPLAIN veya EXPLAIN ANALYZE komutu ile','SHOW INDEX komutu ile','SELECT * FROM indexes ile','Kontrol edilemez'],dogru:0,aciklama:'EXPLAIN komutu sorgunun execution plan\'ını gösterir. Index Scan görünüyorsa index kullanılıyor demektir. Seq Scan tam tablo taraması demektir.'},
  {id:100,seviye:'ileri',konu:'WINDOW',soru:'Aşağıdaki sorgu ne hesaplar?',kod:'<span class="kw">SELECT</span> kategori, ad, skor,
  skor - <span class="fn">AVG</span>(skor) <span class="kw">OVER</span> (<span class="kw">PARTITION BY</span> kategori) <span class="kw">AS</span> ortalama_farki
<span class="kw">FROM</span> urunler',seceneklers:['Her ürünün kendi kategorisinin ortalamasından farkı','Genel ortalamadan fark','Kategorilerin ortalaması','Hata verir'],secenekler:["Her ürünün kendi kategorisinin ortalamasından farkı","Genel ortalamadan fark","Kategorilerin ortalaması","Hata verir"],dogru:0,aciklama:'Bu sorgu her ürünün kendi kategorisindeki ortalama skordan ne kadar saptığını hesaplar. Anormallik tespiti ve kıyaslama için çok kullanışlıdır.'},
// ===== YENİ SORULAR (101-150) =====
  {id:101,seviye:'baslangic',konu:'SELECT',soru:'Bir sütundaki karakterleri küçük harfe çeviren fonksiyon hangisidir?',kod:'<span class="kw">SELECT</span> ???(ad) <span class="kw">FROM</span> musteriler',secenekler:['LOWER','SMALL','LOWERCASE','MINUSCULE'],dogru:0,aciklama:'LOWER() metni küçük harfe çevirir. UPPER() ise büyük harfe. Veri temizleme ve karşılaştırma işlemlerinde sıkça kullanılır.'},
  {id:102,seviye:'baslangic',konu:'SELECT',soru:'Bir sayıyı tam sayıya yuvarlayan (aşağı) fonksiyon hangisidir?',kod:'<span class="kw">SELECT</span> ???(4.7)',secenekler:['FLOOR','CEIL','ROUND','TRUNC'],dogru:0,aciklama:'FLOOR() sayıyı aşağıya yuvarlar (4.7 → 4). CEIL() yukarıya yuvarlar (4.2 → 5). ROUND() en yakına yuvarlar.'},
  {id:103,seviye:'baslangic',konu:'SELECT',soru:'Mutlak değer döndüren fonksiyon hangisidir?',kod:'<span class="kw">SELECT</span> ???(-15)',secenekler:['ABS','ABSOLUTE','MOD','POSITIVE'],dogru:0,aciklama:'ABS() sayının mutlak değerini döndürür. ABS(-15) = 15. Negatif sayıları pozitife çevirir.'},
  {id:104,seviye:'baslangic',konu:'SELECT',soru:'Bölme işleminin kalanını veren operatör hangisidir?',kod:'<span class="kw">SELECT</span> 17 ??? 5',secenekler:['%','MOD','REM','//'],dogru:0,aciklama:'% operatörü (veya MOD fonksiyonu) bölme kalanını verir. 17 % 5 = 2. Çift/tek sayı kontrolü için yaygın kullanılır.'},
  {id:105,seviye:'baslangic',konu:'DATE',soru:'Bugünün tarihini döndüren fonksiyon hangisidir?',kod:'<span class="kw">SELECT</span> ???',secenekler:['CURRENT_DATE','TODAY()','NOW_DATE','GETDATE_ONLY'],dogru:0,aciklama:'CURRENT_DATE bugünün tarihini döndürür. NOW() ise tarih ve saat birlikte döner. GETDATE() SQL Server\'a özgüdür.'},
  {id:106,seviye:'baslangic',konu:'DATE',soru:'İki tarih arasındaki gün farkını bulmak için hangisi kullanılır?',kod:'<span class="kw">SELECT</span> ???(bitis_tarihi, baslangic_tarihi)',secenekler:['DATEDIFF','DATE_MINUS','DATERANGE','BETWEEN_DAYS'],dogru:0,aciklama:'DATEDIFF(tarih1, tarih2) iki tarih arasındaki gün sayısını döndürür. Sonuç pozitif veya negatif olabilir.'},
  {id:107,seviye:'baslangic',konu:'DATE',soru:'Tarihin hangi haftanın gününde olduğunu öğrenmek için ne kullanılır?',kod:'<span class="kw">SELECT</span> ???(tarih)',secenekler:['DAYOFWEEK','WEEKDAY','DAY_NAME','DAYNUM'],dogru:0,aciklama:'DAYOFWEEK() tarihin haftanın kaçıncı günü olduğunu döndürür (1=Pazar, 7=Cumartesi). DAYNAME() gün adını metin olarak döndürür.'},
  {id:108,seviye:'baslangic',konu:'STRING',soru:'Bir metni belirli sayıda tekrarlayan fonksiyon hangisidir?',kod:'<span class="kw">SELECT</span> ???(\'*\', 5)',secenekler:['REPEAT','REPLICATE','COPY','LOOP'],dogru:0,aciklama:'REPEAT(metin, n) metni n kez tekrarlar. REPEAT("*", 5) = "*****" döndürür. Progress bar gibi görsel çıktılar için kullanılır.'},
  {id:109,seviye:'baslangic',konu:'STRING',soru:'Bir metni belirli uzunluğa sol taraftan dolduran fonksiyon hangisidir?',kod:'<span class="kw">SELECT</span> ???(\'42\', 5, \'0\')',secenekler:['LPAD','RPAD','PAD','FILL'],dogru:0,aciklama:'LPAD(metin, uzunluk, dolgu) metni soldan doldurur. LPAD("42", 5, "0") = "00042". Fatura no, ürün kodu formatlama için kullanılır.'},
  {id:110,seviye:'baslangic',konu:'STRING',soru:'Bir metindeki belirli karakteri başka bir karakterle değiştiren fonksiyon hangisidir?',kod:'<span class="kw">SELECT</span> ???(telefon, \'-\', \'\')',secenekler:['REPLACE','CHANGE','SWAP','MODIFY'],dogru:0,aciklama:'REPLACE(metin, aranan, yeni) bulunan tüm eşleşmeleri değiştirir. Telefon numaralarından tire kaldırmak gibi veri temizleme için idealdir.'},
  {id:111,seviye:'baslangic',konu:'STRING',soru:'Bir metinde belirli bir karakter dizisinin konumunu bulan fonksiyon hangisidir?',kod:'<span class="kw">SELECT</span> ???(\'@\', email)',secenekler:['INSTR / POSITION','FIND','LOCATE_CHAR','SEARCH'],dogru:0,aciklama:'INSTR() veya POSITION() metinde aranan karakterin konumunu döndürür. "test@mail.com"da @ pozisyonu 5\'tir.'},
  {id:112,seviye:'baslangic',konu:'SELECT',soru:'Hangi komut yeni bir tablo oluşturur?',kod:'',secenekler:['CREATE TABLE urunler (id INT, ad VARCHAR(100))','MAKE TABLE urunler','NEW TABLE urunler','BUILD TABLE urunler'],dogru:0,aciklama:'CREATE TABLE komutu yeni tablo oluşturur. Sütun adları ve veri tipleri parantez içinde belirtilir.'},
  {id:113,seviye:'baslangic',konu:'SELECT',soru:'Hangi komut bir tabloyu tamamen siler (yapısıyla birlikte)?',kod:'',secenekler:['DROP TABLE','DELETE TABLE','REMOVE TABLE','ERASE TABLE'],dogru:0,aciklama:'DROP TABLE tabloyu tüm verisi ve yapısıyla birlikte siler. TRUNCATE sadece verileri siler, tablo yapısı kalır. DELETE koşullu satır siler.'},
  {id:114,seviye:'baslangic',konu:'SELECT',soru:'VARCHAR ve CHAR veri tipleri arasındaki fark nedir?',kod:'',secenekler:['VARCHAR değişken uzunluklu, CHAR sabit uzunluklu metin saklar','VARCHAR daha hızlıdır','CHAR daha fazla veri saklar','Fark yoktur'],dogru:0,aciklama:'CHAR(10) her zaman 10 karakter yer kaplar (boşlukla doldurur). VARCHAR(10) en fazla 10 karakter saklar, gerçek uzunluk kadar yer kaplar.'},
  {id:115,seviye:'baslangic',konu:'WHERE',soru:'Birden fazla OR koşulunu kısaltmanın en iyi yolu hangisidir?',kod:'<span class="kw">WHERE</span> sehir = \'Ankara\' <span class="kw">OR</span> sehir = \'Istanbul\' <span class="kw">OR</span> sehir = \'Izmir\'',secenekler:["WHERE sehir IN ('Ankara','Istanbul','Izmir')","WHERE sehir = ALL('Ankara','Istanbul','Izmir')","WHERE sehir BETWEEN 'Ankara' AND 'Izmir'","WHERE sehir CONTAINS ('Ankara','Istanbul','Izmir')"],dogru:0,aciklama:'IN operatörü birden fazla OR koşulunu kısaltır. Okunabilirliği artırır ve aynı sonucu verir.'},
  {id:116,seviye:'orta',konu:'WINDOW',soru:'CUME_DIST() fonksiyonu ne döndürür?',kod:'',secenekler:['Kümülatif dağılım — değerin yüzde kaçının bu değere eşit veya küçük olduğu','Toplam satır sayısı','Sıra numarası','Yüzdelik dilim 0-100 arası'],dogru:0,aciklama:'CUME_DIST() 0 ile 1 arasında kümülatif dağılım döndürür. Değerin sıralamasının toplam içindeki oranını gösterir.'},
  {id:117,seviye:'orta',konu:'JOIN',soru:'3 tabloyu birleştiren sorgu nasıl yazılır?',kod:'<span class="kw">SELECT</span> u.ad, k.adi, m.adi
<span class="kw">FROM</span> urunler u
<span class="kw">JOIN</span> kategoriler k <span class="kw">ON</span> u.kategori_id = k.id
??? markalar m <span class="kw">ON</span> u.marka_id = m.id',secenekler:['JOIN','AND JOIN','ALSO JOIN','THEN JOIN'],dogru:0,aciklama:'Birden fazla JOIN zincirleme yazılır. Her JOIN kendi ON koşuluyla birlikte gelir. Teorik olarak sınır yoktur.'},
  {id:118,seviye:'orta',konu:'SUBQUERY',soru:'IN ile EXISTS performans farkı nedir?',kod:'',secenekler:['EXISTS büyük veri setlerinde genellikle daha hızlıdır','IN her zaman daha hızlıdır','Fark yoktur','EXISTS daha yavaştır'],dogru:0,aciklama:'EXISTS alt sorguda ilk eşleşmeyi bulunca durur. IN tüm listeyi döndürür. Büyük tablolarda EXISTS daha iyi performans gösterir.'},
  {id:119,seviye:'orta',konu:'GROUP BY',soru:'Aşağıdaki sorguda GROUP BY olmadan ne olur?',kod:'<span class="kw">SELECT</span> durum, <span class="fn">COUNT</span>(*), <span class="fn">AVG</span>(skor)
<span class="kw">FROM</span> urunler',secenekler:['Hata verir — durum sütunu GROUP BY veya aggregate içinde olmalı','Tüm satırları döndürür','Sadece ilk satırı döndürür','Sonuç değişmez'],dogru:0,aciklama:'Aggregate olmayan sütun (durum) SELECT\'te varsa GROUP BY zorunludur. MySQL bu kuralı bazen görmezden gelir ama diğer veritabanları hata verir.'},
  {id:120,seviye:'orta',konu:'STRING',soru:'Email adresinden domain kısmını çıkaran sorgu hangisidir?',kod:'',secenekler:["SUBSTRING(email, POSITION('@' IN email) + 1)","SPLIT(email, '@', 2)","DOMAIN(email)","RIGHT(email, '@')"],dogru:0,aciklama:"POSITION('@' IN email) @ işaretinin konumunu bulur. SUBSTRING ile @ sonrasını alırız. String fonksiyonlarını birleştirmek güçlü veri dönüşümleri sağlar."},
  {id:121,seviye:'orta',konu:'DATE',soru:'Son 30 günün verilerini getiren sorgu hangisidir?',kod:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> siparisler
<span class="kw">WHERE</span> tarih ???',secenekler:['> CURRENT_DATE - INTERVAL 30 DAY','= LAST 30 DAYS','BETWEEN TODAY AND -30','> DATE_SUB(30)'],dogru:0,aciklama:'CURRENT_DATE - INTERVAL 30 DAY 30 gün öncesini hesaplar. DATE_SUB(CURRENT_DATE, INTERVAL 30 DAY) da aynı işi yapar.'},
  {id:122,seviye:'orta',konu:'PERFORMANCE',soru:'N+1 sorgu problemi nedir?',kod:'',secenekler:['1 sorgu + her satır için 1 sorgu — JOIN ile çözülür','Çok fazla index kullanımı','NULL değerlerin fazlalığı','Tablo çok büyük olduğunda ortaya çıkar'],dogru:0,aciklama:'N+1 problemi: 1 sorgu N kayıt getirir, sonra her kayıt için 1 sorgu daha atılır = N+1 sorgu. JOIN veya subquery ile tek sorguda çözülür.'},
  {id:123,seviye:'orta',konu:'SELECT',soru:'GENERATED ALWAYS AS ne işe yarar?',kod:'<span class="kw">CREATE TABLE</span> urunler (
  fiyat DECIMAL,
  kdv DECIMAL,
  toplam DECIMAL <span class="kw">GENERATED ALWAYS AS</span> (fiyat + kdv)
)',secenekler:['Otomatik hesaplanan sanal sütun oluşturur','Varsayılan değer atar','Otomatik artan sayı oluşturur','Şifreli sütun oluşturur'],dogru:0,aciklama:'GENERATED ALWAYS AS diğer sütunlardan otomatik hesaplanan sanal (computed) sütun oluşturur. Her zaman güncel değer döner.'},
  {id:124,seviye:'orta',konu:'SELECT',soru:'DEFAULT kısıtlaması ne işe yarar?',kod:'<span class="kw">CREATE TABLE</span> urunler (
  durum VARCHAR(20) <span class="kw">DEFAULT</span> \'beklemede\'
)',secenekler:['Değer girilmezse varsayılan değeri kullanır','NULL değeri engeller','Benzersizlik sağlar','Veri tipini belirler'],dogru:0,aciklama:'DEFAULT INSERT sırasında değer belirtilmezse otomatik olarak varsayılan değeri kullanır. Sık kullanılan değerler için pratiktir.'},
  {id:125,seviye:'orta',konu:'SELECT',soru:'CHECK kısıtlaması ne işe yarar?',kod:'<span class="kw">CREATE TABLE</span> urunler (
  skor INT <span class="kw">CHECK</span> (skor <span class="kw">BETWEEN</span> 0 <span class="kw">AND</span> 100)
)',secenekler:['Sütuna girilecek değerlere kural koyar','Değeri otomatik hesaplar','Tabloya index ekler','Foreign key oluşturur'],dogru:0,aciklama:'CHECK kısıtlaması belirli bir koşulu zorunlu kılar. Koşulu sağlamayan değer eklenmez. Veri bütünlüğü için önemlidir.'},
  {id:126,seviye:'orta',konu:'SELECT',soru:'UNIQUE kısıtlaması PRIMARY KEY\'den nasıl farklıdır?',kod:'',secenekler:['UNIQUE NULL\'a izin verir ve bir tabloda birden fazla olabilir, PRIMARY KEY ikisine de izin vermez','PRIMARY KEY daha hızlıdır','UNIQUE sadece sayısal değerler için çalışır','Fark yoktur'],dogru:0,aciklama:'PRIMARY KEY: NULL olamaz, tabloda sadece 1 tane. UNIQUE: NULL olabilir (bazı veritabanlarında birden fazla NULL), tabloda birden fazla UNIQUE olabilir.'},
  {id:127,seviye:'orta',konu:'NORMALIZATION',soru:'1. Normal Form (1NF) ne gerektirir?',kod:'',secenekler:['Her hücre tek değer içermeli, tekrar eden gruplar olmamalı','Tüm sütunlar birbirine bağımlı olmalı','Foreign key zorunlu','Tabloda en az 3 sütun olmalı'],dogru:0,aciklama:'1NF: Her hücre atomik (bölünemez) tek değer içermeli. Bir hücrede "Ali, Veli" gibi liste değerleri 1NF ihlalidir.'},
  {id:128,seviye:'orta',konu:'NORMALIZATION',soru:'2. Normal Form (2NF) ne gerektirir?',kod:'',secenekler:['1NF + tüm sütunlar PRIMARY KEY\'in tamamına bağımlı olmalı','1NF + Foreign key zorunlu','1NF + sütun sayısı sınırı','1NF + NULL yasak'],dogru:0,aciklama:'2NF: 1NF\'yi sağlar + bileşik PRIMARY KEY varsa tüm sütunlar anahtarın tamamına bağlı olmalı, kısmi bağımlılık olmamalı.'},
  {id:129,seviye:'orta',konu:'NORMALIZATION',soru:'Normalizasyonun temel amacı nedir?',kod:'',secenekler:['Veri tekrarını azaltmak ve anomalileri önlemek','Sorguları hızlandırmak','Tablo sayısını azaltmak','Index oluşturmak'],dogru:0,aciklama:'Normalizasyon veri tekrarını (redundancy) azaltır ve güncelleme/silme/ekleme anomalilerini önler. Ancak çok fazla normalizasyon performansı düşürebilir.'},
  {id:130,seviye:'orta',konu:'NORMALIZATION',soru:'Denormalizasyon ne zaman tercih edilir?',kod:'',secenekler:['Okuma performansı kritik olduğunda — JOIN maliyetinden kaçınmak için','Her zaman tercih edilir','Veri bütünlüğü önemli olduğunda','Tablo çok küçük olduğunda'],dogru:0,aciklama:'Denormalizasyon okuma performansını artırmak için bilinçli olarak tekrar eden veri saklamaktır. Raporlama ve analitik sistemlerde yaygındır.'},
  {id:131,seviye:'ileri',konu:'STORED PROCEDURE',soru:'Stored Procedure nedir?',kod:'',secenekler:['Veritabanında saklanan ve adıyla çağrılabilen SQL kod bloğu','Geçici tablo','Otomatik çalışan sorgu','Index türü'],dogru:0,aciklama:'Stored Procedure veritabanında saklanan, parametreli SQL kod bloğudur. CALL veya EXEC ile çağrılır. Kod tekrarını azaltır ve güvenlik sağlar.'},
  {id:132,seviye:'ileri',konu:'STORED PROCEDURE',soru:'Stored Procedure ve Function arasındaki temel fark nedir?',kod:'',secenekler:['Function değer döndürmek zorunda, Procedure döndürmeyebilir ve DML içerebilir','Function daha hızlıdır','Procedure sadece SELECT içerebilir','Fark yoktur'],dogru:0,aciklama:'Function mutlaka değer döndürür ve SELECT içinde kullanılabilir. Procedure değer döndürmeyebilir, INSERT/UPDATE/DELETE içerebilir, transaction yönetebilir.'},
  {id:133,seviye:'ileri',konu:'TRIGGER',soru:'Trigger nedir?',kod:'',secenekler:['Belirli bir olay gerçekleştiğinde otomatik çalışan kod bloğu','Manuel çalıştırılan procedure','Index türü','Backup mekanizması'],dogru:0,aciklama:'Trigger INSERT, UPDATE veya DELETE gibi bir olay gerçekleştiğinde otomatik devreye girer. Audit log, otomatik hesaplama için kullanılır.'},
  {id:134,seviye:'ileri',konu:'TRIGGER',soru:'BEFORE ve AFTER Trigger arasındaki fark nedir?',kod:'',secenekler:['BEFORE işlemden önce, AFTER işlemden sonra çalışır','BEFORE daha hızlıdır','AFTER daha güvenlidir','Sadece DELETE için fark vardır'],dogru:0,aciklama:'BEFORE Trigger veri değişmeden önce çalışır (veriyi değiştirebilir). AFTER Trigger değişiklik sonrası çalışır (log kayıt için ideal).'},
  {id:135,seviye:'ileri',konu:'PERFORMANCE',soru:'Query Execution Plan\'da "Seq Scan" ne anlama gelir?',kod:'',secenekler:['Tablonun tamamı satır satır taranıyor — index kullanılmıyor','Sorgu optimize edilmiş','Paralel çalışıyor','Index kullanılıyor'],dogru:0,aciklama:'Sequential Scan (Seq Scan) tablonun baştan sona tarandığı anlamına gelir. Küçük tablolarda normal, büyük tablolarda index eklemeyi düşün.'},
  {id:136,seviye:'ileri',konu:'PERFORMANCE',soru:'Hangi durumda index işe YARAMAZ?',kod:'',secenekler:['WHERE\'de fonksiyon kullanıldığında: WHERE UPPER(ad) = \'ALI\'','Büyük tablolarda','JOIN\'lerde','ORDER BY\'da'],dogru:0,aciklama:"WHERE UPPER(ad) = 'ALI' gibi sütuna fonksiyon uygulanırsa index kullanılamaz. Bunun yerine Functional Index oluşturulabilir veya veri normalize edilebilir."},
  {id:137,seviye:'ileri',konu:'PERFORMANCE',soru:'SELECT * yerine sütun adlarını belirtmenin avantajı nedir?',kod:'',secenekler:['Daha az veri transfer edilir ve covering index kullanılabilir','Daha hızlı yazılır','NULL değerleri filtreler','Sıralama daha iyi çalışır'],dogru:0,aciklama:'SELECT * tüm sütunları getirir. İhtiyaç yoksa gereksiz veri aktarımı olur. Spesifik sütunlar covering index ile daha hızlı sonuç verir.'},
  {id:138,seviye:'ileri',konu:'PERFORMANCE',soru:'Connection Pool ne işe yarar?',kod:'',secenekler:['Veritabanı bağlantılarını yeniden kullanarak performansı artırır','Sorguları önbelleğe alır','Index oluşturur','Backup alır'],dogru:0,aciklama:'Connection Pool önceden açılmış bağlantıları havuzda saklar. Her istek için yeni bağlantı açmak yerine havuzdan alır — çok daha hızlıdır.'},
  {id:139,seviye:'ileri',konu:'CTE',soru:'Recursive CTE\'de UNION ALL yerine UNION kullanılırsa ne olur?',kod:'',secenekler:['Performans düşer çünkü tekrar kontrol için ek işlem gerekir','Hata verir','Daha hızlı çalışır','Fark yoktur'],dogru:0,aciklama:'Recursive CTE\'de UNION ALL tercih edilir çünkü tekrar eden satır kontrolü yapmaz ve daha hızlıdır. UNION her adımda tekrar kontrolü yapar.'},
  {id:140,seviye:'ileri',konu:'INDEX',soru:'Bitmap Index ne zaman kullanılır?',kod:'',secenekler:['Az sayıda benzersiz değeri olan sütunlarda (düşük cardinality)','Çok sayıda benzersiz değeri olan sütunlarda','Her sütunda','Sadece sayısal sütunlarda'],dogru:0,aciklama:'Bitmap Index az değer alan sütunlarda (cinsiyet, durum, şehir gibi) etkilidir. Çok benzersiz değerde (isim, email) B-tree index daha iyidir.'},
  {id:141,seviye:'ileri',konu:'WINDOW',soru:'UNBOUNDED FOLLOWING ne anlama gelir?',kod:'<span class="kw">ROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING</span>',secenekler:['Mevcut satırdan sonuna kadar tüm satırlar','Sonsuz satır','Sadece son satır','Belirtilmemiş aralık'],dogru:0,aciklama:'UNBOUNDED FOLLOWING partition\'ın sonuna kadar demektir. ROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING = mevcut satırdan sona kadar.'},
  {id:142,seviye:'ileri',konu:'NORMALIZATION',soru:'3. Normal Form (3NF) ne gerektirir?',kod:'',secenekler:['2NF + non-key sütunlar birbirine değil sadece primary key\'e bağımlı olmalı','2NF + foreign key zorunlu','2NF + NULL yasak','2NF + index zorunlu'],dogru:0,aciklama:'3NF: 2NF\'yi sağlar + geçişli bağımlılık (transitive dependency) olmamalı. Non-key sütunlar sadece primary key\'e bağlı olmalı, başka non-key sütuna değil.'},
  {id:143,seviye:'ileri',konu:'STORED PROCEDURE',soru:'OUT parametresi ne işe yarar?',kod:'',secenekler:['Procedure\'dan değer döndürmek için kullanılır','Giriş değeri almak için kullanılır','Hem giriş hem çıkış için kullanılır','Hata döndürür'],dogru:0,aciklama:'IN parametresi giriş, OUT parametresi çıkış, INOUT ise hem giriş hem çıkış içindir. OUT ile procedure birden fazla değer döndürebilir.'},

    <span class="kw">WHEN</span> skor >= 50 <span class="kw">THEN</span> \'C\'
    <span class="kw">ELSE</span> \'F\'
  <span class="kw">END</span> <span class="kw">AS</span> harf_notu
<span class="kw">FROM</span> urunler',secenekler:['Her ürün için skora göre harf notu (A/B/C/F)','Sadece A notu alanlar','Tüm skorlar','NULL döner'],dogru:0,aciklama:'CASE WHEN SQL\'deki if-else yapısıdır. Her satır için skora göre harf notu hesaplanır. Veri sınıflandırma için çok yaygın kullanılır.'},

let mod = 'calis';
let aktifSorular = [...sorular];
let soruIndex = 0;
let dogru = 0, yanlis = 0, cozulen = 0;
let sinavSorular = [], sinavDogru = 0, sinavYanlis = 0;
let timerInterval = null, kalanSure = 120;
let cevaplandı = false;

// TEMA
function toggleTheme(){
  const h=document.documentElement, dark=h.getAttribute('data-theme')==='dark';
  h.setAttribute('data-theme',dark?'light':'dark');
  document.getElementById('themeBtn').textContent=dark?'☀️ Açık':'🌙 Koyu';
}

// MOD
function setMod(m){
  mod=m;
  document.getElementById('tabCalis').classList.toggle('active',m==='calis');
  document.getElementById('tabSinav').classList.toggle('active',m==='sinav');
  document.getElementById('filtreBar').style.display=m==='calis'?'flex':'none';
  document.getElementById('sonucEkrani').classList.remove('show');
  if(m==='sinav') baslatSinav(); else { stopTimer(); document.getElementById('sinavHeader').style.display='none'; aktifSorular=[...sorular]; soruIndex=0; gosterSoru(); }
}

// FİLTRE
function filtrele(f, btn){
  document.querySelectorAll('.filtre-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(f==='hepsi') aktifSorular=[...sorular];
  else if(['baslangic','orta','ileri'].includes(f)) aktifSorular=sorular.filter(s=>s.seviye===f);
  else aktifSorular=sorular.filter(s=>s.konu===f);
  soruIndex=0; gosterSoru();
}

// SORU GÖSTER
function gosterSoru(){
  const wrap=document.getElementById('soruWrap');
  document.getElementById('sonucEkrani').classList.remove('show');
  if(soruIndex>=aktifSorular.length){
    wrap.innerHTML=`<div class="soru-card" style="text-align:center;padding:3rem">
      <div style="font-size:3rem;margin-bottom:1rem">🎉</div>
      <div style="font-size:1.2rem;font-weight:700;color:var(--ink);margin-bottom:.5rem">Bu filtredeki tüm sorular bitti!</div>
      <div style="font-size:.9rem;color:var(--mid);margin-bottom:1.5rem">Başa dön veya farklı bir filtre seç.</div>
      <button class="btn btn-accent" onclick="soruIndex=0;gosterSoru()">Başa Dön</button>
    </div>`; return;
  }
  const s=aktifSorular[soruIndex];
  cevaplandı=false;
  wrap.innerHTML=`
    <div class="soru-card">
      <div class="soru-meta">
        <span class="soru-num">SORU ${soruIndex+1}/${aktifSorular.length}</span>
        <span class="seviye-badge ${s.seviye}">${s.seviye==='baslangic'?'🟢 Başlangıç':s.seviye==='orta'?'🟡 Orta':'🔴 İleri'}</span>
        <span class="konu-badge">${s.konu}</span>
      </div>
      <div class="soru-text">${s.soru}</div>
      ${s.kod?`<div class="code-block">${s.kod}</div>`:''}
      <div class="secenekler" id="secenekler">
        ${s.secenekler.map((sec,i)=>`
          <div class="secenek" onclick="cevapla(${i})" id="sec${i}">
            <div class="secenek-harf">${String.fromCharCode(65+i)}</div>
            <div class="secenek-text">${sec}</div>
          </div>`).join('')}
      </div>
      <div class="sonuc" id="sonucDiv"></div>
      <div class="soru-actions">
        <div class="progress-bar"><div class="progress-fill" style="width:${(soruIndex/aktifSorular.length)*100}%"></div></div>
        <button class="btn btn-ghost" id="aciklamaBtn" onclick="aciklamaGoster()" style="display:none">💡 Açıklama</button>
        <button class="btn btn-accent" id="sonrakiBtn" onclick="sonraki()" style="display:none">Sonraki →</button>
      </div>
    </div>`;
  updateStats();
}

function cevapla(i){
  if(cevaplandı) return;
  cevaplandı=true;
  const s=mod==='calis'?aktifSorular[soruIndex]:sinavSorular[soruIndex];
  const dogrum=i===s.dogru;
  document.querySelectorAll('.secenek').forEach((el,idx)=>{
    el.classList.add('disabled');
    if(idx===s.dogru) el.classList.add('correct');
    else if(idx===i && !dogrum) el.classList.add('wrong');
  });
  const div=document.getElementById('sonucDiv');
  div.className='sonuc show '+(dogrum?'dogru':'yanlis');
  div.innerHTML=`<div class="sonuc-baslik">${dogrum?'✅ Doğru!':'❌ Yanlış!'}</div><div class="sonuc-aciklama">${s.aciklama}</div>`;
  if(dogrum){ dogru++; if(mod==='sinav')sinavDogru++; }
  else{ yanlis++; if(mod==='sinav')sinavYanlis++; }
  cozulen++;
  document.getElementById('dogruSay').textContent=dogru;
  document.getElementById('yanlisSay').textContent=yanlis;
  document.getElementById('sonrakiBtn').style.display='inline-flex';
  updateStats();
}

function aciklamaGoster(){
  const s=aktifSorular[soruIndex];
  const div=document.getElementById('sonucDiv');
  div.className='sonuc show';
  div.style.background='var(--surface2)'; div.style.border='1px solid var(--border)';
  div.innerHTML=`<div class="sonuc-baslik" style="color:var(--accent)">💡 Açıklama</div><div class="sonuc-aciklama">${s.aciklama}</div>`;
}

function sonraki(){
  soruIndex++;
  if(mod==='sinav' && soruIndex>=sinavSorular.length){ bitirSinav(); return; }
  if(mod==='sinav'){ document.getElementById('sinavSoru').textContent=`Soru ${soruIndex+1} / ${sinavSorular.length}`; gosterSinavSoru(); }
  else gosterSoru();
}

// SINAV
function baslatSinav(){
  sinavSorular=[...sorular].sort(()=>Math.random()-.5).slice(0,10);
  sinavDogru=0; sinavYanlis=0; soruIndex=0; kalanSure=120;
  document.getElementById('sinavHeader').style.display='flex';
  document.getElementById('sinavSoru').textContent='Soru 1 / 10';
  gosterSinavSoru();
  stopTimer();
  timerInterval=setInterval(()=>{
    kalanSure--;
    const m=Math.floor(kalanSure/60).toString().padStart(2,'0');
    const s=(kalanSure%60).toString().padStart(2,'0');
    const el=document.getElementById('sinavTimer');
    el.textContent=`${m}:${s}`;
    el.classList.toggle('warning',kalanSure<=30);
    if(kalanSure<=0){ stopTimer(); bitirSinav(); }
  },1000);
}

function gosterSinavSoru(){
  const s=sinavSorular[soruIndex];
  cevaplandı=false;
  document.getElementById('soruWrap').innerHTML=`
    <div class="soru-card">
      <div class="soru-meta">
        <span class="soru-num">SORU ${soruIndex+1}/10</span>
        <span class="seviye-badge ${s.seviye}">${s.seviye==='baslangic'?'🟢 Başlangıç':s.seviye==='orta'?'🟡 Orta':'🔴 İleri'}</span>
        <span class="konu-badge">${s.konu}</span>
      </div>
      <div class="soru-text">${s.soru}</div>
      ${s.kod?`<div class="code-block">${s.kod}</div>`:''}
      <div class="secenekler" id="secenekler">
        ${s.secenekler.map((sec,i)=>`
          <div class="secenek" onclick="cevapla(${i})" id="sec${i}">
            <div class="secenek-harf">${String.fromCharCode(65+i)}</div>
            <div class="secenek-text">${sec}</div>
          </div>`).join('')}
      </div>
      <div class="sonuc" id="sonucDiv"></div>
      <div class="soru-actions">
        <div class="progress-bar"><div class="progress-fill" style="width:${(soruIndex/10)*100}%"></div></div>
        <button class="btn btn-accent" id="sonrakiBtn" onclick="sonraki()" style="display:none">${soruIndex===9?'Testi Bitir ✓':'Sonraki →'}</button>
      </div>
    </div>`;
}

function bitirSinav(){
  stopTimer();
  document.getElementById('sinavHeader').style.display='none';
  document.getElementById('soruWrap').innerHTML='';
  const pct=Math.round(sinavDogru/10*100);
  const emoji=pct>=80?'🏆':pct>=60?'👏':pct>=40?'💪':'📚';
  const mesaj=pct>=80?'Harika! Çok iyi biliyorsun!':pct>=60?'İyi iş! Biraz daha pratik yapabilirsin.':pct>=40?'Devam et, gelişiyorsun!':'Daha fazla çalışma zamanı!';
  const gecenSure=120-kalanSure;
  const dm=Math.floor(gecenSure/60), ds=gecenSure%60;
  document.getElementById('sonucEmoji').textContent=emoji;
  document.getElementById('sonucBaslik').textContent=mesaj;
  document.getElementById('sonucPuan').textContent=`${sinavDogru}/10`;
  document.getElementById('sonucDetay').textContent=`Başarı oranı: %${pct}`;
  document.getElementById('sDogru').textContent=sinavDogru;
  document.getElementById('sYanlis').textContent=sinavYanlis;
  document.getElementById('sSure').textContent=`${dm}:${ds.toString().padStart(2,'0')}`;
  document.getElementById('sonucEkrani').classList.add('show');
}

function tekrarla(){ setMod('sinav'); }
function stopTimer(){ if(timerInterval){clearInterval(timerInterval);timerInterval=null;} }

function updateStats(){
  document.getElementById('toplamSoru').textContent=sorular.length;
  document.getElementById('cozulenSoru').textContent=cozulen;
  document.getElementById('dogruSoru').textContent=dogru;
  document.getElementById('yanlisSoru').textContent=yanlis;
}

gosterSoru();
updateStats();
</script>
</body>
</html>
